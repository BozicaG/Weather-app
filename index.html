<!doctype html><html lang="sr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" type="image/png" href="favicon.png"><title>Weather App</title><script defer="defer" src="bundle.js"></script></head><body class="sunny"><div id="weather-container"><div class="top-bar"><input id="city-input" placeholder="Search for cities"> <button id="search-btn">Search</button> <button id="toggle-temp">°C / °F</button></div><div id="loader">Loading...</div><div class="main-content"><div class="left-panel"><section class="current-section"><div class="weather-info"><h1 id="city-name">Novi Sad</h1><p id="condition">--</p></div><div class="temp-range"><h2 id="current-temp">--°</h2><div class="minMax"><span>Min: <span id="min-temp">--</span></span> <span>Max: <span id="max-temp">--</span></span></div></div><img id="weather-icon" alt="Weather"></section><section class="air-section"><h3>AIR CONDITIONS</h3><div class="weather-details"><div class="detail-item"><p>🌡️ Feels Like</p><span id="feels-like">--</span></div><div class="detail-item"><p>💧 Humidity</p><span id="humidity">--</span></div><div class="detail-item"><p>💨 Wind Speed</p><span id="wind-speed">--</span></div><div class="detail-item"><p>☀️ UV Index</p><span id="uv-index">--</span></div><div class="detail-item"><p>🌅 Sunrise</p><span id="sunrise">--</span></div><div class="detail-item"><p>🌇 Sunset</p><span id="sunset">--</span></div></div></section><section class="hourly"><h3>TODAY'S FORECAST</h3><div id="hourly-container"></div></section></div><aside class="forecast"><h3>7-DAY FORECAST</h3><div id="forecast-container"></div></aside></div><div id="animation-layer"></div></div><script src="bundle.js"></script></body></html>
